<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Caricature of Volodymyr Zelensky">
	<!-- Original cartoon caricature in the app's flat, thick-outline style; not traced from any reference -->
	<rect width="200" height="200" fill="#4FA8D8"/>
	<rect y="100" width="200" height="100" fill="#F5C83A"/>
	<g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
		<!-- broad, strong shoulders in an olive t-shirt -->
		<path d="M-8 206 Q-2 136 100 132 Q202 136 208 206 Z" fill="#5C6A3A"/>
		<!-- muscular upper arms -->
		<path d="M18 150 Q8 176 14 206 M182 150 Q192 176 186 206" fill="none" stroke-width="3"/>
		<!-- thick neck and collar -->
		<path d="M78 112 L122 112 L124 136 Q100 154 76 136 Z" fill="#F0BE8E"/>
		<path d="M72 134 Q100 160 128 134" fill="none" stroke-width="5"/>
		<!-- Ukrainian trident on the chest -->
		<g fill="none" stroke-linecap="round">
			<path d="M84 160 L84 174 Q84 184 100 188 Q116 184 116 174 L116 160 M100 156 L100 190" stroke="#111111" stroke-width="8"/>
			<path d="M78 162 L84 154 L90 162 Z M110 162 L116 154 L122 162 Z M94 160 L100 150 L106 160 Z" fill="#111111" stroke="#111111" stroke-width="4"/>
			<path d="M84 160 L84 174 Q84 184 100 188 Q116 184 116 174 L116 160 M100 156 L100 190" stroke="#F5C83A" stroke-width="4"/>
			<path d="M80 161 L84 156 L88 161 Z M112 161 L116 156 L120 161 Z M96 159 L100 152 L104 159 Z" fill="#F5C83A" stroke="#F5C83A" stroke-width="2"/>
		</g>
		<!-- ears -->
		<ellipse cx="48" cy="92" rx="7" ry="11" fill="#F0BE8E"/>
		<ellipse cx="152" cy="92" rx="7" ry="11" fill="#F0BE8E"/>
		<!-- squarer, stronger jaw -->
		<path d="M50 78 Q50 34 100 32 Q150 34 150 78 Q154 112 140 126 Q124 138 100 138 Q76 138 60 126 Q46 112 50 78 Z" fill="#F0BE8E"/>
		<!-- full stubble beard along the jaw -->
		<path d="M50 92 Q50 128 76 138 Q100 142 124 138 Q150 128 150 92 Q144 120 124 124 Q100 116 76 124 Q56 120 50 92 Z" fill="#5C4A3C"/>
		<path d="M86 122 Q100 128 114 122" fill="none" stroke="#F0BE8E" stroke-width="3"/>
		<!-- buzzed hair -->
		<path d="M52 66 Q48 34 100 30 Q152 34 148 66 Q142 50 128 46 Q100 40 72 46 Q58 50 52 66 Z" fill="#4A3B30"/>
		<!-- thick, determined brows -->
		<path d="M64 74 L92 70" stroke-width="7"/>
		<path d="M108 70 L136 74" stroke-width="7"/>
		<!-- steady eyes -->
		<path d="M68 83 Q80 77 92 83 Q80 89 68 83 Z" fill="#FFFFFF" stroke-width="3"/>
		<path d="M108 83 Q120 77 132 83 Q120 89 108 83 Z" fill="#FFFFFF" stroke-width="3"/>
		<circle cx="80" cy="83" r="2.8" fill="#111111" stroke="none"/>
		<circle cx="120" cy="83" r="2.8" fill="#111111" stroke="none"/>
		<!-- nose -->
		<path d="M98 86 Q93 99 100 102 Q107 100 104 95" fill="none" stroke-width="3"/>
		<!-- firm, set mouth -->
		<path d="M86 110 Q100 113 114 110" fill="none" stroke-width="4"/>
	</g>
</svg>
