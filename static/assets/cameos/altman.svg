<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Caricature of Sam Altman">
	<!-- Original cartoon caricature, flat colours and thin outlines with big soft heads in the style of the freeonis videos; not traced from any reference -->
	<g stroke="#1c1c1c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
		<path d="M40 206 Q44 150 100 148 Q156 150 160 206 Z" fill="#C9D1D9"/>
		<path d="M74 152 Q100 178 126 152 L120 148 L80 148 Z" fill="#AEB8C2"/>
		<path d="M88 160 L88 190 M112 160 L112 190" stroke="#7A8794" stroke-width="4"/>
		<path d="M86 128 L114 128 L114 154 L86 154 Z" fill="#F7D9BF"/>
		<ellipse cx="42" cy="92" rx="8" ry="12" fill="#F7D9BF"/>
		<ellipse cx="158" cy="92" rx="8" ry="12" fill="#F7D9BF"/>
		<ellipse cx="100" cy="84" rx="60" ry="56" fill="#F7D9BF"/>
		<!-- A full head of curls, each one a separate thought -->
		<g fill="#8B5E3C">
			<circle cx="56" cy="54" r="16"/>
			<circle cx="72" cy="38" r="17"/>
			<circle cx="94" cy="30" r="18"/>
			<circle cx="118" cy="34" r="17"/>
			<circle cx="140" cy="48" r="16"/>
			<circle cx="150" cy="66" r="13"/>
			<circle cx="48" cy="70" r="13"/>
		</g>
		<path d="M56 118 Q62 138 100 142 Q138 138 144 118 Q136 134 100 134 Q64 134 56 118 Z" fill="#D8B08D" opacity="0.4" stroke="none"/>
		<path d="M60 62 L94 58" stroke="#8B5E3C" stroke-width="5"/>
		<path d="M106 58 L140 62" stroke="#8B5E3C" stroke-width="5"/>
		<!-- Eyes wide open, as if the model just said something alarming -->
		<ellipse cx="76" cy="82" rx="12" ry="14" fill="#FFFFFF"/>
		<ellipse cx="124" cy="82" rx="12" ry="14" fill="#FFFFFF"/>
		<ellipse cx="76" cy="84" rx="5" ry="6" fill="#1C1C1C" stroke="none"/>
		<ellipse cx="124" cy="84" rx="5" ry="6" fill="#1C1C1C" stroke="none"/>
		<path d="M64 100 Q74 104 86 100" fill="none" stroke-width="2" opacity="0.6"/>
		<path d="M114 100 Q126 104 136 100" fill="none" stroke-width="2" opacity="0.6"/>
		<ellipse cx="100" cy="107" rx="8" ry="9" fill="#E7B394"/>
		<path d="M88 122 Q100 130 112 121" fill="none" stroke-width="3"/>
		<!-- A small glowing orb, labelled by nobody -->
		<circle cx="150" cy="178" r="20" fill="#4FA8D8"/>
		<circle cx="150" cy="178" r="13" fill="#8FD3F4"/>
		<path d="M150 168 Q160 178 150 188 Q140 178 150 168 Z" fill="#FFFFFF"/>
		<path d="M136 166 L130 158 M164 166 L170 158 M136 190 L130 198 M164 190 L170 198" stroke="#4FA8D8" stroke-width="4"/>
	</g>
</svg>
