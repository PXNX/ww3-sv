<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Caricature of Vladimir Putin">
	<!-- Original cartoon caricature in the app's flat, thick-outline style; not traced from any reference -->
	<rect width="200" height="200" fill="#6A7C9B"/>
	<g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
		<!-- very long table -->
		<rect x="-4" y="172" width="208" height="40" fill="#8A5A3A"/>
		<!-- suit, shoulders a little slumped -->
		<path d="M10 174 Q16 144 100 140 Q184 144 190 174 Z" fill="#2C3140"/>
		<path d="M80 140 L100 170 L120 140 Z" fill="#FFFFFF"/>
		<path d="M94 144 L106 144 L104 156 L96 156 Z" fill="#2D4E8F"/>
		<path d="M96 156 L104 156 L108 172 L100 174 L92 172 Z" fill="#2D4E8F"/>
		<path d="M60 148 L88 174 M140 148 L112 174" fill="none" stroke-width="3"/>
		<!-- thin neck -->
		<path d="M86 122 L114 122 L116 140 L100 148 L84 140 Z" fill="#F1CDB0"/>
		<!-- big ears -->
		<ellipse cx="52" cy="94" rx="8" ry="13" fill="#F1CDB0"/>
		<ellipse cx="148" cy="94" rx="8" ry="13" fill="#F1CDB0"/>
		<!-- bald, pale, drooping face -->
		<path d="M52 82 Q50 34 100 32 Q150 34 148 82 Q150 116 130 132 Q116 144 100 144 Q84 144 70 132 Q50 116 52 82 Z" fill="#F1CDB0"/>
		<!-- last thin wisps above the ears -->
		<path d="M52 86 Q47 72 55 62 Q56 74 58 88 Z" fill="#CBB48A" stroke-width="3"/>
		<path d="M148 86 Q153 72 145 62 Q144 74 142 88 Z" fill="#CBB48A" stroke-width="3"/>
		<!-- shine on the bald head -->
		<path d="M72 46 Q92 36 112 40" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
		<!-- forehead wrinkles -->
		<path d="M74 54 Q100 49 126 54 M78 62 Q100 58 122 62" fill="none" stroke-width="2"/>
		<!-- sad brows, inner ends raised -->
		<path d="M64 78 L92 68" stroke="#8A7650" stroke-width="4.5"/>
		<path d="M108 68 L136 78" stroke="#8A7650" stroke-width="4.5"/>
		<!-- tired, heavy-lidded eyes looking down -->
		<path d="M68 86 Q80 80 92 86 Q80 92 68 86 Z" fill="#FFFFFF" stroke-width="3"/>
		<path d="M108 86 Q120 80 132 86 Q120 92 108 86 Z" fill="#FFFFFF" stroke-width="3"/>
		<circle cx="80" cy="87" r="2.8" fill="#2D4E8F" stroke="none"/>
		<circle cx="120" cy="87" r="2.8" fill="#2D4E8F" stroke="none"/>
		<path d="M66 84 Q80 76 94 84 M106 84 Q120 76 134 84" fill="none" stroke-width="3.5"/>
		<!-- eye bags -->
		<path d="M68 96 Q80 102 92 96 M108 96 Q120 102 132 96" fill="none" stroke-width="2.5"/>
		<!-- big sausage nose -->
		<path d="M93 82 Q86 102 90 114 Q100 124 110 114 Q114 102 107 82 Z" fill="#EBA796" stroke-width="4"/>
		<path d="M94 116 Q97 119 98 114 M102 114 Q103 119 106 116" fill="none" stroke-width="2.5"/>
		<path d="M97 90 Q95 104 96 108" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
		<!-- nasolabial lines, jowls, sad downturned mouth -->
		<path d="M84 110 Q76 124 80 134 M116 110 Q124 124 120 134" fill="none" stroke-width="2.5"/>
		<path d="M62 106 Q64 128 82 138 M138 106 Q136 128 118 138" fill="none" stroke-width="2.5"/>
		<path d="M84 134 Q100 126 116 134" fill="none" stroke-width="4"/>
	</g>
</svg>
