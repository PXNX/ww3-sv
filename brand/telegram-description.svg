<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- The picture above the description in an empty chat with @game_ww3_bot (640×360, set in BotFather).
       Rendered to telegram-description.png by scripts/generate-brand.ts. -->
  <defs>
    <style>@font-face { font-family: Baloo; font-weight: 700; src: url("../static/fonts/baloo-2-latin-700-normal.woff2"); }</style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="0.7" stop-color="#2b3c63"/><stop offset="1" stop-color="#3d4f78"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f7c86a" stop-opacity="0.9"/><stop offset="0.55" stop-color="#e5484d" stop-opacity="0.35"/><stop offset="1" stop-color="#e5484d" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f5efd6" stop-opacity="0.32"/><stop offset="1" stop-color="#f5efd6" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="640" height="360"/></clipPath>
    <clipPath id="globe"><circle cx="300" cy="372" r="186"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#f5efd6" opacity="0.7"><circle cx="40" cy="40" r="2.2"/><circle cx="120" cy="26" r="1.4"/><circle cx="210" cy="58" r="1.4"/><circle cx="300" cy="22" r="2.2"/><circle cx="352" cy="70" r="1.4"/><circle cx="600" cy="30" r="1.4"/><circle cx="560" cy="96" r="2.2"/><circle cx="24" cy="130" r="1.4"/><circle cx="250" cy="110" r="1.4"/><circle cx="620" cy="150" r="2.2"/></g>
  <!-- searchlights -->
  <path d="M70 300 L10 0 L90 0 Z" fill="url(#beam)" transform="rotate(-14 70 300)"/>
  <path d="M300 300 L250 0 L330 0 Z" fill="url(#beam)" transform="rotate(18 300 300)"/>
  <!-- warm sunburst behind the globe -->
  <circle cx="478" cy="170" r="190" fill="url(#glow)"/>
  <g fill="#f7c86a" opacity="0.13" transform="translate(478 170)"><path d="M0 0L-34 -520L34 -520Z" transform="rotate(0)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(22.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(45)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(67.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(90)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(112.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(135)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(157.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(180)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(202.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(225)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(247.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(270)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(292.5)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(315)"/><path d="M0 0L-34 -520L34 -520Z" transform="rotate(337.5)"/></g>
  <!-- refinery skyline and the sea -->
