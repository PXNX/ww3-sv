    <path d="M0 300 L0 262 L30 262 L30 236 L44 236 L44 262 L70 262 L76 214 L82 214 L88 262 L120 262 L120 246 L160 246 L160 262 L190 262 L196 196 L204 196 L210 262 L236 262 L236 240 L262 232 L262 262 L300 262 L300 300 Z"/>
    <path d="M128 246 C128 230 152 230 152 246"/>
    <path d="M560 300 L560 270 L580 270 L590 238 L600 270 L640 270 L640 300 Z"/>
  </g>
  <g stroke="#0f1729" stroke-width="3" fill="none"><path d="M248 236 L262 200 L276 236 M252 226 L272 226 M256 214 L268 214"/></g>
  <path d="M82 214 C 86 200, 70 196, 76 182 C 80 172, 92 172, 88 160" fill="none" stroke="#f5efd6" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
  <rect y="296" width="640" height="64" fill="#1d3b5c"/>
  <g stroke="#4fa8d8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" fill="none"><path d="M30 318 h40 M140 334 h60 M420 316 h50 M520 340 h70 M250 348 h30"/></g>
