<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Caricature of Benjamin Netanyahu">
	<!-- Original cartoon caricature in the app's flat, thick-outline style; not traced from any reference -->
	<rect width="200" height="200" fill="#6A7C9B"/>
	<g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
		<!-- dark suit, white shirt, light blue tie -->
		<path d="M14 204 Q18 142 100 138 Q182 142 186 204 Z" fill="#262B38"/>
		<path d="M78 138 L100 172 L122 138 Z" fill="#FFFFFF"/>
		<path d="M94 142 L106 142 L104 154 L96 154 Z" fill="#8FC7EA"/>
		<path d="M96 154 L104 154 L110 192 L100 200 L90 192 Z" fill="#8FC7EA"/>
		<path d="M60 146 L88 190 M140 146 L112 190" fill="none" stroke-width="3"/>
		<!-- neck -->
		<path d="M86 116 L114 116 L116 138 L100 146 L84 138 Z" fill="#F0C09A"/>
		<!-- ears -->
		<ellipse cx="52" cy="92" rx="7" ry="11" fill="#F0C09A"/>
		<ellipse cx="148" cy="92" rx="7" ry="11" fill="#F0C09A"/>
		<!-- face -->
		<ellipse cx="100" cy="90" rx="48" ry="50" fill="#F0C09A"/>
		<!-- silver hair combed straight back, high forehead -->
		<path d="M52 76 Q48 36 100 30 Q152 36 148 76 Q146 56 132 46 Q100 36 70 46 Q54 56 52 76 Z" fill="#C7CBD2"/>
		<path d="M64 48 Q100 32 138 48 M70 58 Q100 42 132 58" fill="none" stroke-width="2.5"/>
		<!-- brows, one high -->
		<path d="M68 72 L92 70" stroke="#8C919B" stroke-width="5"/>
		<path d="M108 66 L132 72" stroke="#8C919B" stroke-width="5"/>
		<!-- eyes with bags -->
		<path d="M68 82 Q80 76 92 82 Q80 88 68 82 Z" fill="#FFFFFF" stroke-width="3"/>
		<path d="M108 82 Q120 76 132 82 Q120 88 108 82 Z" fill="#FFFFFF" stroke-width="3"/>
		<circle cx="80" cy="82" r="2.6" fill="#111111" stroke="none"/>
		<circle cx="120" cy="82" r="2.6" fill="#111111" stroke="none"/>
		<path d="M70 92 Q80 96 90 92 M110 92 Q120 96 130 92" fill="none" stroke-width="2"/>
		<!-- nose -->
		<path d="M98 86 Q93 100 100 104 Q108 102 104 96" fill="none" stroke-width="3"/>
		<!-- earnest, slightly pained mouth -->
		<path d="M86 118 Q100 112 114 118" fill="none" stroke-width="4"/>
		<path d="M74 100 Q76 112 84 118 M126 100 Q124 112 116 118" fill="none" stroke-width="2.5"/>
	</g>
</svg>
