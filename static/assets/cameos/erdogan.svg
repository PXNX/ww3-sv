<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Caricature of Recep Tayyip Erdoğan">
	<!-- Original cartoon caricature in the app's flat, thick-outline style; not traced from any reference -->
	<rect width="200" height="200" fill="#5BBFB0"/>
	<g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
		<!-- bridge toll booth bar -->
		<path d="M0 176 L200 176 L200 200 L0 200 Z" fill="#FFFFFF"/>
		<path d="M20 176 L40 200 M60 176 L80 200 M100 176 L120 200 M140 176 L160 200 M180 176 L200 200" fill="none" stroke="#E5484D" stroke-width="8"/>
		<!-- dark suit, white shirt, red tie -->
		<path d="M14 178 Q18 142 100 138 Q182 142 186 178 Z" fill="#20242E"/>
		<path d="M80 138 L100 168 L120 138 Z" fill="#FFFFFF"/>
		<path d="M94 142 L106 142 L104 152 L96 152 Z" fill="#E5484D"/>
		<path d="M96 152 L104 152 L108 172 L100 176 L92 172 Z" fill="#E5484D"/>
		<!-- neck -->
		<path d="M86 118 L114 118 L116 138 L100 146 L84 138 Z" fill="#EDB88C"/>
		<!-- ears -->
		<ellipse cx="52" cy="94" rx="7" ry="11" fill="#EDB88C"/>
		<ellipse cx="148" cy="94" rx="7" ry="11" fill="#EDB88C"/>
		<!-- face -->
		<path d="M52 84 Q52 44 100 42 Q148 44 148 84 Q150 124 100 138 Q50 124 52 84 Z" fill="#EDB88C"/>
		<!-- dark hair at the temples under the hat -->
		<path d="M52 82 Q50 60 58 50 Q62 62 62 80 Z M148 82 Q150 60 142 50 Q138 62 138 80 Z" fill="#2B2420" stroke-width="3"/>
		<!-- red fez with black tassel -->
		<path d="M58 54 L68 14 Q100 6 132 14 L142 54 Q100 64 58 54 Z" fill="#C8232C"/>
		<path d="M68 14 Q100 22 132 14" fill="none" stroke-width="4"/>
		<path d="M58 54 Q100 64 142 54" fill="none" stroke="#7A1219" stroke-width="3"/>
		<path d="M102 18 Q140 8 150 38" fill="none" stroke-width="3"/>
		<path d="M146 36 L154 36 L156 58 L144 58 Z" fill="#111111" stroke-width="3"/>
		<!-- brows -->
		<path d="M68 76 L92 74" stroke-width="5"/>
		<path d="M108 74 L132 76" stroke-width="5"/>
		<!-- eyes -->
		<path d="M68 86 Q80 80 92 86 Q80 92 68 86 Z" fill="#FFFFFF" stroke-width="3"/>
		<path d="M108 86 Q120 80 132 86 Q120 92 108 86 Z" fill="#FFFFFF" stroke-width="3"/>
		<circle cx="80" cy="86" r="2.6" fill="#111111" stroke="none"/>
		<circle cx="120" cy="86" r="2.6" fill="#111111" stroke="none"/>
		<!-- nose -->
		<path d="M98 90 Q93 104 100 108 Q108 106 104 100" fill="none" stroke-width="3"/>
		<!-- thin, trimmed moustache and a smug half-smile -->
		<path d="M82 114 Q100 108 118 114 Q100 118 82 114 Z" fill="#2B2420" stroke-width="3"/>
		<path d="M86 124 Q100 130 116 122" fill="none" stroke-width="4"/>
	</g>
</svg>
